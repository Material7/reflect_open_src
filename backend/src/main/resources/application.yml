spring:
  application:
    name: Reflect

  config:
    import: optional:file:./application-secret.yml

  # ---------------------------
  # DataSource設定
  # ---------------------------
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/reflect?TimeZone=Asia/Tokyo}
    username: ${DB_USER:spring}
    # 必須: 未設定の場合は起動に失敗します
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 2
      maximum-pool-size: ${DB_POOL_SIZE:10}
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 20000
      pool-name: HikariPool-Reflect

  # ---------------------------
  # JPA設定
  # ---------------------------
  jpa:
    hibernate:
      # スキーマはエンティティ定義から自動生成・追記される（マイグレーション管理は行っていない）。
      # update はカラム追加には追従するが、削除・型変更・リネームには追従しない。
      # 本番でスキーマを固定したい場合は JPA_DDL_AUTO=validate を指定し、
      # 差分は手動 DDL で適用すること。
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          "[time_zone]": Asia/Tokyo
        "[format_sql]": false
        "[use_sql_comments]": false

# ---------------------------
# サーバー / SSL設定
# 本番(Docker)では SSL_ENABLED=false, SERVER_PORT=8080 を環境変数で渡す
# ローカル開発では環境変数未設定でデフォルト値(HTTPS/8443)が使われる
# ---------------------------
server:
  port: ${SERVER_PORT:8443}
  ssl:
    enabled: ${SSL_ENABLED:true}
    key-store: ${SSL_KEYSTORE:classpath:keystore.p12}
    key-store-type: PKCS12
    key-store-password: ${SSL_KEYSTORE_PASSWORD:}
    key-alias: ${SSL_KEY_ALIAS:myalias}

# ---------------------------
# JWT設定
# ---------------------------
jwt:
  # 必須: 256bit(32文字)以上のランダム文字列。未設定の場合は起動に失敗します
  # 生成例: openssl rand -base64 64
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

# ---------------------------
# CORS設定
# 既定は localhost のみ許可。別ホストから配信する場合はカンマ区切りで指定する
# 例: CORS_ALLOWED_ORIGINS=https://reflect.example.com,http://192.168.1.10:5173
# ---------------------------
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://localhost:*,http://localhost:*}

# ---------------------------
# SVN設定
# ---------------------------
svn:
  log-limit: ${SVN_LOG_LIMIT:30}

git:
  log-limit: ${GIT_LOG_LIMIT:30}

# ---------------------------
# VCS認証情報の暗号化キー
# 必須: 32文字以上のランダム文字列。未設定の場合は起動に失敗します
# 生成例: openssl rand -base64 48 | tr -d '/+=\n'
# ⚠ この鍵を失うと保存済みのVCS認証情報は復号不能になります
# ---------------------------
credential:
  encryption-key: ${CREDENTIAL_ENC_KEY}
